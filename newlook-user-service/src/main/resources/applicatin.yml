server:
  port: 8082
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: user-service

  cloud:
    config:
      enabled: false

    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        service-name: user-service
        health-check-interval: 10s
        health-check-path: /api/v1/actuator/health
        instance-id: "${spring.application.name}:${server.port}"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newlook_user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:test_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      pool-name: UserServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_db
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    schemas: user_db

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.newlook.user: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    hikari:
      maximum-pool-size: 50

logging:
  level:
    root: WARN
    com.newlook.user: INFO
