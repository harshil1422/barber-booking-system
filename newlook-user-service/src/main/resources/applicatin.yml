spring:
  application:
    name: user-service

  # ── Config Server ─────────────────────────────────────────
  # Reads secrets (DB password, etc.) from HashiCorp Vault
  # via Spring Cloud Config Server at :8888
  config:
    import: "optional:configserver:http://localhost:8888"

  # ── Database ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ${DB_USERNAME:newlook}
    password: ${DB_PASSWORD:newlook}         # overridden by Vault in prod
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: UserServiceHikariPool

  # ── JPA ───────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate                     # Flyway owns schema — never let JPA touch it
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: user_db
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    schemas: user_db

  # ── Security: stateless — JWT validated at Gateway ────────
  # This service trusts X-User-Id and X-User-Role headers
  # injected by the API Gateway after JWT validation.
  # It does NOT re-validate JWTs itself.

# ── Server ────────────────────────────────────────────────────
server:
  port: 8082
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

# ── Consul Service Discovery ──────────────────────────────────
spring.cloud.consul:
  host: localhost
  port: 8500
  discovery:
    service-name: user-service
    health-check-interval: 10s
    health-check-path: /api/v1/actuator/health
    instance-id: "${spring.application.name}:${server.port}"

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ── SpringDoc / Swagger ───────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.newlook.user: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}/%X{spanId}] %logger{36} - %msg%n"

---
# ── PRODUCTION profile ────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 50

logging:
  level:
    com.newlook.user: INFO
    root: WARN