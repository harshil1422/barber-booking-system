services:

  nginx:
    image: nginx:1.27-alpine
    container_name: newlook-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      frontend:
        condition: service_started
      api-gateway:
        condition: service_started

    networks:
      - newlook


  frontend:
    build:
      context: ./barber-booking-ui
      dockerfile: Dockerfile

    container_name: newlook-frontend
    restart: unless-stopped

    expose:
      - "80"

    networks:
      - newlook


  api-gateway:
    build:
      context: ./apiGateWay
      dockerfile: Dockerfile

    container_name: newlook-api-gateway
    restart: unless-stopped

    expose:
      - "9090"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_SERVICE_URL: http://auth-service:8087

    depends_on:
      auth-service:
        condition: service_healthy

    networks:
      - newlook


  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: newlook-auth-service
    restart: unless-stopped

    expose:
      - "8087"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost/oauth2/callback}

    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - newlook
  
  user-service:
    build:
      context: ./newlook-user-service
      dockerfile: Dockerfile

    container_name: newlook-user-service
    restart: unless-stopped

    expose:
      - "8088"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
      DB_USERNAME: ${USER_DB_USERNAME}
      DB_PASSWORD: ${USER_DB_PASSWORD}

      SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED: "false"

    depends_on:
      user-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8088/api/v1/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - newlook

  user-db:
    image: postgres:16-alpine
    container_name: newlook-user-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}

    volumes:
      - user-db-data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${USER_DB_USERNAME} -d ${USER_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - newlook    

  auth-db:
    image: postgres:16-alpine
    container_name: newlook-auth-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    volumes:
      - auth-db-data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_DB_USERNAME} -d ${AUTH_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - newlook


  redis:
    image: redis:7-alpine
    container_name: newlook-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    expose:
      - "6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - newlook


networks:
  newlook:
    driver: bridge


volumes:
  auth-db-data:
  redis-data:
  user-db-data: