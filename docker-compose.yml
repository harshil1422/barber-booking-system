services:
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: notification-service

    ports:
      - "8087:8087" 
    environment: 
      DB_HOST: notification-db
      DB_PORT: 5432
      DB: newlook_notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: test_123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
        


  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    command:
      [
        "bash",
        "-c",
        "/opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --create \
        --if-not-exists \
        --topic booking.appointment.events \
        --partitions 3 \
        --replication-factor 1"
      ]

    restart: "no"


  booking-db:
    image: postgres:16
    container_name: booking-db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: newlook_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_123

    volumes:
      - booking-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newlook_booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile

    container_name: booking-service

    ports:
      - "8084:8084"

    environment:
      DB_HOST: booking-db
      DB_PORT: 5432
      DB_NAME: newlook_booking_db
      DB_USER: postgres
      DB_PASSWORD: test_123
      KAFKA_BROKERS: kafka:29092

    restart: unless-stopped

    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy


  notification-db:
    image: postgres:16
    container_name: notification-db

    environment:
      POSTGRES_DB: newlook_notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_123

    ports:
      - "5433:5432"

    volumes:
      - notification-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d newlook_notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  gateway:
    build: ./apiGateway

    ports:
      - "9090:9090"


  barber-booking-ui:
    build: ./barber-booking-ui

    ports:
      - "4200:80"

    depends_on:
      - gateway


volumes:
  kafka-data:
  booking-db-data:
  notification-db-data: