flyway:
  enabled: true
  locations: classpath:db/migration
  schemas: booking_db
  default-schema: booking_db
  baseline-on-migrate: true

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newlook_booking_db}?currentSchema=booking_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:test_123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: booking_db
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: true
    open-in-view: false


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

server:
  port: 8084

spring.cloud.consul:
  host: ${CONSUL_HOST:localhost}
  port: ${CONSUL_PORT:8500}
  discovery:
    service-name: booking-service
    health-check-path: /actuator/health
    health-check-interval: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

newlook:
  booking:
    # Idempotency key TTL in Redis (24 hours)
    idempotency-ttl-hours: 24

    # Default cancellation window: must cancel at least 30 min before slot
    default-cancel-window-minutes: 30

    # Walk-in queue: max customers allowed in queue per chair
    walkin-queue-max: 10

    # Slot generation: how far in advance to generate slots (days)
    slot-generation-days-ahead: 14

    # Chair service internal URL
    chair-service-url: ${CHAIR_SERVICE_URL:http://chair-service:8085}

    # Shop service internal URL
    shop-service-url: ${SHOP_SERVICE_URL:http://shop-service:8083}


# ============================================================
# OUTBOX
# ============================================================

outbox:
  fallback-scheduler:
    enabled: ${OUTBOX_FALLBACK_ENABLED:false}

  publisher:
    processing-timeout: 5m
    fixed-delay: 1000
    batch-size: 50
    recovery-delay: 60000


# ============================================================
# DEVELOPMENT PROFILE
# ============================================================

---
spring:
  config:
    activate:
      on-profile: development

  jpa:
    show-sql: true

outbox:
  fallback-scheduler:
    enabled: true

logging:
  level:
    com.newlook: DEBUG
    org.springframework.kafka: INFO
