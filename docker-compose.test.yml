services:

  auth-test-db:
    image: postgres:16-alpine
    container_name: newlook-auth-test-db

    ports:
      - "5434:5432"

    environment:
      POSTGRES_DB: barber_auth_test
      POSTGRES_USER: auth_test_user
      POSTGRES_PASSWORD: auth_test_password

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U auth_test_user -d barber_auth_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s