app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMzJieXRlcw==
    access-token-expiry: 900
    refresh-token-expiry: 604800
    issuer: test-app

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5434/barber_auth_test}
    username: ${TEST_DB_USERNAME:auth_test_user}
    password: ${TEST_DB_PASSWORD:auth_test_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6370     # Use a test Redis or Testcontainers

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    
user-service:
  base-url: http://localhost:8088

